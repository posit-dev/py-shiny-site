name: Verify job results
description: >
  Fail if any upstream job did not succeed. Used by the `done-*` aggregator job
  in each workflow -- the single stable check that branch protection requires, so
  that the jobs it covers can be added, renamed, or re-sharded without touching
  the required-checks list.

  Two things make this correct, and both are easy to get wrong when hand-rolling
  it in a new workflow, which is why it lives here:

  1. The aggregator job must set `if: always()`. Without it, a failing upstream
     job makes the aggregator *skip*, and GitHub reports a skipped job as
     "Success" even when it is a required check -- so the failure passes silently.
  2. `skipped` must count as a failure here, for the same reason: a job that was
     skipped because something upstream of it failed did not verify anything.

  Pass `${{ toJSON(needs.*.result) }}`. That expression expands to every entry in
  the calling job's `needs:`, so adding a job to `needs:` needs no change here.

inputs:
  results:
    description: 'JSON array of upstream job results -- pass `${{ toJSON(needs.*.result) }}`.'
    required: true

runs:
  using: composite
  steps:
    - name: Verify every upstream job succeeded
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: |
        echo "Job results: $RESULTS"
        if echo "$RESULTS" | grep -qE 'failure|cancelled|skipped'; then
          exit 1
        fi
        echo "All upstream jobs succeeded."
