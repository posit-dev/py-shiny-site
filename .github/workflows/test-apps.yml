name: test-apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      - name: Set up py-shiny-site
        uses: ./.github/internal/setup-py-shiny-site

      - name: Install dependencies
        run: make deps

      # Run the browser in a cached Docker container instead of installing it on
      # the runner; pytest-playwright connects over PW_TEST_CONNECT_WS_ENDPOINT.
      - name: Set up remote Playwright
        uses: ./.github/internal/setup-playwright-remote

      # Per-component controller interaction tests + conftest unit tests --
      # everything except the smoke sweep (which runs in test-smoke.yml). Uses
      # the Makefile target (chromium + xdist from pytest.ini; install-playwright
      # no-ops because the remote server env is set above).
      - name: Run per-component app tests (shard ${{ matrix.shard }} of 6)
        run: make test-apps PYTEST_ARGS="--num-shards 6 --shard-id ${{ matrix.shard }}"

  # Single stable check for branch protection / auto-merge. The `apps` matrix
  # above may be re-sharded freely without touching the required-checks list.
  done-test-apps:
    name: done-test-apps
    # `always()` is required: without it, a failing shard would make this job
    # skip, and GitHub treats a skipped required check as satisfied.
    if: always()
    needs: apps
    runs-on: ubuntu-latest
    steps:
      - name: Verify that every apps shard succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled|skipped'; then
            exit 1
          fi
